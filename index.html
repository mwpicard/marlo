<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marlo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d0b1a;
            --bg-card: #1a1730;
            --bg-card-hover: #231f42;
            --purple-deep: #2d1b69;
            --purple-mid: #6c3ce0;
            --purple-light: #a78bfa;
            --neon-green: #39ff7f;
            --neon-blue: #00d4ff;
            --neon-pink: #ff3cac;
            --neon-orange: #ff9a3c;
            --text-main: #e8e2f8;
            --text-dim: #9990b8;
            --gradient-1: linear-gradient(135deg, #6c3ce0, #00d4ff);
            --gradient-2: linear-gradient(135deg, #ff3cac, #ff9a3c);
            --gradient-3: linear-gradient(135deg, #39ff7f, #00d4ff);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background particles */
        .bg-particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            animation: float-up linear infinite;
            opacity: 0.15;
        }
        @keyframes float-up {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.15; }
            90% { opacity: 0.15; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Grid pattern overlay */
        .grid-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(108, 60, 224, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(108, 60, 224, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Language Switcher */
        .lang-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 6px;
            z-index: 100;
            background: var(--bg-card);
            padding: 6px;
            border-radius: 30px;
            border: 1px solid rgba(108, 60, 224, 0.3);
            backdrop-filter: blur(10px);
        }
        .lang-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .lang-btn.active {
            background: var(--purple-mid);
            color: white;
            box-shadow: 0 0 15px rgba(108, 60, 224, 0.5);
        }
        .lang-btn:hover:not(.active) { color: var(--text-main); }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 80px 0 40px;
        }
        .avatar-container {
            position: relative;
            display: inline-block;
            margin-bottom: 30px;
        }
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--gradient-1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            position: relative;
            z-index: 2;
            animation: pulse-glow 3s ease-in-out infinite;
            box-shadow: 0 0 40px rgba(108, 60, 224, 0.4);
            overflow: hidden;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 40px rgba(108, 60, 224, 0.4); }
            50% { box-shadow: 0 0 60px rgba(108, 60, 224, 0.7), 0 0 100px rgba(0, 212, 255, 0.2); }
        }
        .avatar-ring {
            position: absolute;
            top: -8px; left: -8px;
            width: 166px; height: 166px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--neon-green);
            border-right-color: var(--neon-blue);
            animation: spin 4s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .hero h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .hero .tagline {
            font-size: 1.15rem;
            color: var(--text-dim);
            margin-bottom: 6px;
        }
        .hero .location {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--neon-orange);
            font-weight: 500;
            font-size: 1rem;
        }
        .hero .age-badge {
            display: inline-block;
            margin-top: 15px;
            background: var(--bg-card);
            border: 1px solid rgba(108, 60, 224, 0.3);
            padding: 8px 20px;
            border-radius: 20px;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.95rem;
            color: var(--purple-light);
        }

        /* Languages spoken */
        .languages {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .lang-tag {
            background: rgba(108, 60, 224, 0.15);
            border: 1px solid rgba(108, 60, 224, 0.3);
            padding: 6px 16px;
            border-radius: 15px;
            font-size: 0.85rem;
            color: var(--purple-light);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Section titles */
        .section-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title .icon {
            font-size: 1.5rem;
        }
        .section-title .line {
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, rgba(108, 60, 224, 0.5), transparent);
            border-radius: 2px;
        }

        /* Interests Grid */
        .interests-section { margin-top: 50px; }
        .interests-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }
        .interest-card {
            background: var(--bg-card);
            border: 1px solid rgba(108, 60, 224, 0.15);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: default;
            position: relative;
            overflow: hidden;
        }
        .interest-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 3px;
            border-radius: 16px 16px 0 0;
        }
        .interest-card:nth-child(1)::before { background: var(--gradient-1); }
        .interest-card:nth-child(2)::before { background: var(--gradient-2); }
        .interest-card:nth-child(3)::before { background: var(--gradient-3); }
        .interest-card:nth-child(4)::before { background: linear-gradient(135deg, #ff9a3c, #ff3cac); }
        .interest-card:nth-child(5)::before { background: linear-gradient(135deg, #00d4ff, #6c3ce0); }
        .interest-card:nth-child(6)::before { background: linear-gradient(135deg, #39ff7f, #6c3ce0); }

        .interest-card:hover {
            transform: translateY(-6px);
            background: var(--bg-card-hover);
            border-color: rgba(108, 60, 224, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .interest-card .emoji {
            font-size: 2.5rem;
            margin-bottom: 12px;
            display: block;
        }
        .interest-card h3 {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 6px;
        }
        .interest-card p {
            font-size: 0.9rem;
            color: var(--text-dim);
            line-height: 1.5;
        }

        /* About section */
        .about-section { margin-top: 50px; }
        .about-card {
            background: var(--bg-card);
            border: 1px solid rgba(108, 60, 224, 0.15);
            border-radius: 20px;
            padding: 35px;
            position: relative;
            overflow: hidden;
        }
        .about-card::after {
            content: '';
            position: absolute;
            top: -50%; right: -50%;
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(108, 60, 224, 0.08), transparent 70%);
            pointer-events: none;
        }
        .about-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-dim);
            position: relative;
            z-index: 1;
        }
        .about-text .highlight {
            color: var(--purple-light);
            font-weight: 600;
        }

        /* Fun Facts */
        .facts-section { margin-top: 50px; }
        .facts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .fact-card {
            background: var(--bg-card);
            border: 1px solid rgba(108, 60, 224, 0.15);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            transition: all 0.3s;
        }
        .fact-card:hover {
            border-color: rgba(108, 60, 224, 0.4);
            transform: translateY(-4px);
        }
        .fact-number {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .fact-label {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 50px 0 30px;
            color: var(--text-dim);
            font-size: 0.85rem;
        }
        .footer .made-with {
            margin-bottom: 8px;
        }
        .footer .wave {
            display: inline-block;
            animation: wave 2s ease-in-out infinite;
        }
        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(20deg); }
            75% { transform: rotate(-15deg); }
        }

        /* Scroll animations */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Chess animation mini-game */
        .chess-piece {
            display: inline-block;
            transition: transform 0.3s;
        }
        .chess-piece:hover {
            transform: scale(1.3) rotate(10deg);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .hero h1 { font-size: 2.2rem; }
            .facts-grid { grid-template-columns: 1fr; }
            .interests-grid { grid-template-columns: 1fr; }
            .lang-switcher { top: 10px; right: 10px; }
            .container { padding: 15px; }
        }

        /* Typing effect for tagline */
        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: var(--purple-light);
            margin-left: 4px;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>

<script>
    // Create floating particles
    const particlesContainer = document.getElementById('particles');
    const colors = ['#6c3ce0', '#00d4ff', '#39ff7f', '#ff3cac', '#ff9a3c'];
    for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        const size = Math.random() * 8 + 3;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.background = colors[Math.floor(Math.random() * colors.length)];
        particle.style.animationDuration = (Math.random() * 15 + 10) + 's';
        particle.style.animationDelay = (Math.random() * 10) + 's';
        particlesContainer.appendChild(particle);
    }

    // Scroll reveal
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
            }
        });
    }, { threshold: 0.1 });

    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

    // Multi-language support
    let currentLang = 'en';

    function setLang(lang) {
        currentLang = lang;
        document.documentElement.setAttribute('data-lang', lang);

        // Update active button
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.textContent.trim() === lang.toUpperCase());
        });

        // Update all translatable elements
        document.querySelectorAll('[data-en]').forEach(el => {
            const text = el.getAttribute('data-' + lang);
            if (text) {
                if (el.tagName === 'P' || el.classList.contains('about-text')) {
                    el.innerHTML = text;
                } else {
                    el.innerHTML = text;
                }
            }
        });
    }

    // Initialize with English
    setLang('en');

    // Fun: konami code easter egg
    let konamiCode = [];
    const konamiSequence = [38, 38, 40, 40, 37, 39, 37, 39, 66, 65];
    document.addEventListener('keydown', (e) => {
        konamiCode.push(e.keyCode);
        if (konamiCode.length > konamiSequence.length) konamiCode.shift();
        if (JSON.stringify(konamiCode) === JSON.stringify(konamiSequence)) {
            document.body.style.transition = 'filter 0.5s';
            document.body.style.filter = 'hue-rotate(180deg)';
            setTimeout(() => { document.body.style.filter = 'none'; }, 3000);
        }
    });

    // Card tilt effect on mouse move
    document.querySelectorAll('.interest-card').forEach(card => {
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = (y - centerY) / 20;
            const rotateY = (centerX - x) / 20;
            card.style.transform = `translateY(-6px) perspective(500px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });
        card.addEventListener('mouseleave', () => {
            card.style.transform = '';
        });
